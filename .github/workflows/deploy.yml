name: Deploy

# Pull requests: preview build (fixtures, noindex) uploaded as a Cloudflare Workers preview version.
# main: production build (no fixtures; placeholder guard enforced) deployed to production.
# Both steps are skipped until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: 1
  HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:preview
        env:
          SITE_URL: ${{ vars.PREVIEW_SITE_URL || 'https://preview.invalid' }}
      - name: Upload preview version
        id: upload
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.number }}
      - name: Note the preview URL
        if: env.HAS_CLOUDFLARE == 'true'
        run: |
          echo "Preview: ${{ steps.upload.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Cloudflare not configured
        if: env.HAS_CLOUDFLARE != 'true'
        run: |
          echo "Skipping preview upload: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets." >> "$GITHUB_STEP_SUMMARY"

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production build (never with fixtures)
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_SHOW_FIXTURES: 'false'
          PUBLIC_ENQUIRY_ENABLED: ${{ vars.PUBLIC_ENQUIRY_ENABLED || 'false' }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_ANALYTICS_PROVIDER: ${{ vars.PUBLIC_ANALYTICS_PROVIDER || 'none' }}
          PUBLIC_ANALYTICS_DOMAIN: ${{ vars.PUBLIC_ANALYTICS_DOMAIN }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Cloudflare not configured
        if: env.HAS_CLOUDFLARE != 'true'
        run: |
          echo "Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets." >> "$GITHUB_STEP_SUMMARY"
