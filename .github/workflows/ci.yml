name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Type check, lint, unit tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Production build (placeholder guard, image audit, internal links)
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://example.invalid' }}

  e2e:
    name: End-to-end, accessibility, responsive, motion and visual
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  preview-quality:
    name: Lighthouse budgets and link check (preview build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preview build (production bundle + fixtures, noindex)
        run: pnpm build:preview
        env:
          SITE_URL: https://preview.invalid
      - name: Lighthouse CI (mobile; performance, LCP, CLS, TBT and size budgets)
        run: pnpm lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --root-dir ${{ github.workspace }}/dist/client
            --exclude 'preview\.invalid' --exclude '^https?://localhost'
            --accept 200,204,206,301,302,308,429
            'dist/client/**/*.html'
          fail: true
